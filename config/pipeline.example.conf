# Pipeline data contract v1. Values are examples and must be supplied for each run.
NANT=4
NCHAN=1
NPOL=2
PAYLOAD_ORDER=UNKNOWN

# Raw ring record: 64-byte application header followed by payload.
# Compute ring record: payload only.
PKT_HEADER=64
PKT_DATA=8192
PKT_NSAMP=512
PKT_NBIT=16           # bits per sample value
PKT_TSAMP=0.001       # microseconds per sample

RECORDS_PER_BLOCK=16384
RAW_RING_BLOCKS=8
COMPUTE_RING_BLOCKS=8
FILE_BLOCKS=10
DIRECT_IO=true

# Supplied by the external observation controller at runtime.
UTC_START=2026-08-01-00:00:00
